    >ADALAJ</text>

    <!-- MADE FOR REAL MOMENTS -->
    <text
      x="400"
      y="196"
      text-anchor="middle"
      fill="#FFFFFF"
      font-family="system-ui, -apple-system, sans-serif"
      font-size="24"
      font-weight="700"
      letter-spacing="4"
    >MADE FOR REAL MOMENTS</text>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="420" text-anchor="middle" fill="#FDE68A" font-family="system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" letter-spacing="2">PACKING OPS</text>
  <text x="256" y="448" text-anchor="middle" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="600" opacity="0.8">GUJARAT · INDIA</text>
